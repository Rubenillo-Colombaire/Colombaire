<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COLOMBAIRE · Prueba de acceso</title><style>body{font-family:system-ui,sans-serif;background:#f6f2e8;color:#173e30;margin:0;padding:24px}main{max-width:440px;margin:5vh auto;background:#fff;border-radius:18px;padding:28px;box-shadow:0 6px 28px #163e3020}h1{text-align:center;letter-spacing:2px}p{line-height:1.5}input,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border-radius:9px;font:inherit}input{border:1px solid #bbc6bd}button{border:0;background:#194b37;color:white;cursor:pointer}button.alt{background:#e9dfc7;color:#173e30}.muted{font-size:13px;color:#59685e}.hidden{display:none}#msg{white-space:pre-wrap;overflow-wrap:anywhere}button:disabled{opacity:.5}</style></head><body><main><h1>COLOMBAIRE</h1><p style="text-align:center">Acceso privado · Entorno de pruebas</p><p class="muted">Esta página NO lee, modifica ni sube los palomos guardados en tu móvil.</p><section id="signedOut"><input id="email" type="email" autocomplete="email" placeholder="Correo electrónico"><input id="password" type="password" autocomplete="current-password" placeholder="Contraseña (mínimo 6 caracteres)"><button id="login">Iniciar sesión</button><button id="signup" class="alt">Crear cuenta</button><button id="reset" class="alt">Recuperar contraseña</button><button id="invite" class="alt">Ya tengo invitación: establecer contraseña</button></section><section id="signedIn" class="hidden"><p id="account"></p><button id="change">Establecer o cambiar contraseña</button><button id="logout" class="alt">Cerrar sesión</button></section><p id="msg" role="status"></p><p class="muted">Nunca introduzcas la contraseña de PostgreSQL ni claves secretas aquí. Solo tu contraseña de usuario.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
(()=>{'use strict';const base='https://mjbamwhnalljvmnogqzi.supabase.co',key='sb_publishable_pLmcbeWD6LGbT1MC2bUMxw_8Ng80tY6';const $=id=>document.getElementById(id);const msg=s=>$('msg').textContent=s;const client=window.supabase.createClient(base,key,{auth:{detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});const redirect=location.origin+location.pathname;let busy=false;async function run(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);msg('Procesando…');try{await fn()}catch(e){msg('No se ha podido completar: '+(e.message||String(e)))}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}const credentials=()=>({email:$('email').value.trim(),password:$('password').value});async function show(){const {data,error}=await client.auth.getUser();const u=error?null:data.user;$('signedOut').classList.toggle('hidden',!!u);$('signedIn').classList.toggle('hidden',!u);$('account').textContent=u?'Sesión iniciada: '+u.email:'';if(u)msg('Cuenta conectada. Esta prueba NO sincroniza palomos.');}client.auth.onAuthStateChange(()=>{setTimeout(show,0)});$('login').onclick=()=>run(async()=>{const {error}=await client.auth.signInWithPassword(credentials());if(error)throw error;await show()});$('signup').onclick=()=>run(async()=>{const c=credentials();if(!c.email||c.password.length<6)throw Error('Introduce un correo y una contraseña de al menos 6 caracteres.');const {error}=await client.auth.signUp({...c,options:{emailRedirectTo:redirect}});if(error)throw error;msg('Si el registro se ha aceptado, revisa tu correo para confirmar la cuenta. Si ya existe, usa Iniciar sesión o Recuperar contraseña.')});$('reset').onclick=()=>run(async()=>{const email=$('email').value.trim();if(!email)throw Error('Introduce primero tu correo.');const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:redirect});if(error)throw error;msg('Si el correo corresponde a una cuenta, recibirás un enlace de recuperación. Abre el enlace en este navegador.')});$('invite').onclick=()=>run(async()=>{const {data}=await client.auth.getSession();if(!data.session){msg('Abre primero el enlace de invitación recibido por correo. Debe redirigir a esta página de pruebas. Si el enlace caducó, solicitaremos otro.');return}const password=$('password').value;if(password.length<8)throw Error('Escribe una contraseña nueva de al menos 8 caracteres.');const {error}=await client.auth.updateUser({password});if(error)throw error;msg('Contraseña configurada. Ya puedes iniciar sesión.');await show()});$('change').onclick=()=>run(async()=>{const password=prompt('Nueva contraseña de usuario (mínimo 8 caracteres):');if(password===null)return;if(password.length<8)throw Error('Debe tener al menos 8 caracteres.');const {error}=await client.auth.updateUser({password});if(error)throw error;msg('Contraseña actualizada.')});$('logout').onclick=()=>run(async()=>{const {error}=await client.auth.signOut();if(error)throw error;await show();msg('Sesión cerrada.')});show().catch(e=>msg('Error al iniciar: '+e.message));})();
</script></body></html>
